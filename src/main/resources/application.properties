# Application configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/indutranslator
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
flyway.enabled=false

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Authentication Provider (local, ldap, keycloak)
auth.provider=local

# AI Provider Configuration
ai.provider=openai
ai.model=gpt-4

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.ru.indutranslator=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# MinIO
minio.endpoint=localhost
minio.port=9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.use-ssl=false
minio.bucket-name=indutranslator-documents

# JWT Configuration
jwt.secret=AIGen-InduTranslator-Secret-Key-2024-Production-Ready-Encryption-Key
jwt.expiration=86400
