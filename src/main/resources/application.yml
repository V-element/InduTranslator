spring:
  application:
    name: InduTranslator
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
  cache:
    type: redis

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# MinIO Configuration
minio:
  endpoint: localhost
  port: 9000
  access-key: minioadmin
  secret-key: minioadmin123
  use-ssl: false
  bucket-name: indutranslator-documents

# AI/LLM Configuration
ai:
  provider: openai
  api-key: your-api-key-here
  base-url: https://api.openai.com/v1
  model: gpt-4
  max-tokens: 2048
  temperature: 0.7
  top-p: 1.0

# JWT Configuration
jwt:
  secret: your-super-secret-jwt-key-change-in-production
  expiration: 86400

# Flyway
flyway:
  enabled: false

# Logging
logging:
  level:
    root: INFO
    ru.indutranslator: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized

# Debug
debug: true
